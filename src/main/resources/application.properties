spring.application.name=ExploreEasternIndia

server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/explore_eastern_india
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Spring AI - Groq Configuration
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.session.repository.jdbc.initialize-schema=always
spring.ai.openai.chat.replay-reasoning-content=false
